name: asciicrystal-mathematical
version: 0.3.5.5

description: |
  STEM (math) processing extension for asciicrystal.
  Renders LaTeX and AsciiMath expressions via KaTeX or MathJax
  (client-side or server-side with katex CLI).
  Pragmatic Crystal port inspired by the asciidoctor-mathematical Ruby gem 0.3.5
  (different approach: KaTeX/MathJax instead of Mathematical/lasem C library).

authors:
  - Philippe Nénert <philippe@aloli.fr>

license: MIT

# Pour le développement local, remplacer par :
#   asciicrystal:
#     path: ../crystal-asciidoctor
dependencies:
  asciicrystal:
    github: aloli-crystal/crystal-asciidoctor
    version: "~> 2.0.26.12"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

crystal: ">= 1.19.0"
